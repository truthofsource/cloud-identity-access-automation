<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="178" data-purpose-icon="n0_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2" /><path d="M2 8h20M5 5.5h.1M8 5.5h.1M11 5.5h.1" /></g></svg>
<text x="600.0" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Staff browser + MSAL</text>
<text x="600.0" y="266" text-anchor="middle" font-size="14" fill="#40556b">Signs staff in and obtains proof for</text>
<text x="600.0" y="284" text-anchor="middle" font-size="14" fill="#40556b">application requests.</text>
</g>
<g data-node="n1_0"><rect x="425.0" y="404" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="416" data-purpose-icon="n1_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#745386" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#745386" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3" /><path d="M2 20v-2a7 7 0 0 1 11-5m4-2 5 2v4c0 3-5 5-5 5s-5-2-5-5v-4l5-2Z" /></g></svg>
<text x="600.0" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Business Functions API</text>
<text x="600.0" y="504" text-anchor="middle" font-size="14" fill="#40556b">Checks the user's current access to the</text>
<text x="600.0" y="522" text-anchor="middle" font-size="14" fill="#40556b">requested records.</text>
</g>
<g data-node="n2_0"><rect x="425.0" y="642" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="654" data-purpose-icon="n2_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0" /></g></svg>
<text x="600.0" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Business records</text>
<text x="600.0" y="742" text-anchor="middle" font-size="14" fill="#40556b">Identifies the exact person and requested</text>
<text x="600.0" y="760" text-anchor="middle" font-size="14" fill="#40556b">account change.</text>
</g>
<g data-node="n3_0"><rect x="425.0" y="880" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="892" data-purpose-icon="n3_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2" width="18" height="20" rx="1" /><path d="M7 7h.1M10 7h7M7 12h.1m3 0h7M7 17h.1m3 0h7" /></g></svg>
<text x="600.0" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Lifecycle journal</text>
<text x="600.0" y="980" text-anchor="middle" font-size="14" fill="#40556b">Saves the operation so its progress can be</text>
<text x="600.0" y="998" text-anchor="middle" font-size="14" fill="#40556b">tracked.</text>
</g>
<g data-node="n4_0"><rect x="425.0" y="1118" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="1130" data-purpose-icon="n4_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#745386" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#745386" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 2 1 3h4l1-3 3 2-1 3 2 3 3-1v5l-3 1-2 3 1 3-3 2-1-3h-4l-1 3-3-2 1-3-2-3-3-1V9l3 1 2-3-1-3 3-2Z" /><path d="m10 8 6 4-6 4V8Z" /></g></svg>
<text x="600.0" y="1190" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Dedicated directory worker</text>
<text x="600.0" y="1218" text-anchor="middle" font-size="14" fill="#40556b">Handles privileged account work separately</text>
<text x="600.0" y="1236" text-anchor="middle" font-size="14" fill="#40556b">from the main API.</text>
</g>
<g data-node="n5_0"><rect x="233.0" y="1356" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="390.0" y="1368" data-purpose-icon="n5_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3" /><path d="M2 20v-2a7 7 0 0 1 11-5m4-2 5 2v4c0 3-5 5-5 5s-5-2-5-5v-4l5-2Z" /></g></svg>
<text x="408.0" y="1428" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Microsoft Graph / Entra</text>
<text x="408.0" y="1456" text-anchor="middle" font-size="14" fill="#40556b">Makes the reviewed change in the identity</text>
<text x="408.0" y="1474" text-anchor="middle" font-size="14" fill="#40556b">directory.</text>
</g>
<g data-node="n5_1"><rect x="617.0" y="1356" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="774.0" y="1368" data-purpose-icon="n5_1"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h10l5 5v15H5V2Zm10 0v6h5M8 12h9m-9 4h9m-9 4h5" /></g></svg>
<text x="792.0" y="1428" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Operation receipts</text>
<text x="792.0" y="1456" text-anchor="middle" font-size="14" fill="#40556b">Records the result and checks what actually</text>
<text x="792.0" y="1474" text-anchor="middle" font-size="14" fill="#40556b">changed.</text>
</g>
