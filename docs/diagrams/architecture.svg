<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1682" viewBox="0 0 1200 1682" role="img" aria-labelledby="title desc">
<title id="title">Cloud identity and access — illustrated architecture</title>
<desc id="desc">Actual sign-in and separate directory-lifecycle boundaries. Deployment OIDC and runtime managed identities have different jobs. Password-reset automation remains outside the accepted enabled path.</desc>
